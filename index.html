<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chauffes">
<meta name="theme-color" content="#2f6b45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Journal de chauffes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : une colonne étroite, en-tête collant ; accueil = liste des chauffes ; une chauffe = 4 onglets. Grosses zones tactiles. */
:root{
  --bg:#eef1ec; --surface:#ffffff; --sunk:#e3e8e1; --line:#cfd6cc;
  --fg:#1d2620; --muted:#5d6a61; --accent:#2f6b45; --accent-ink:#ffffff; --accent-soft:#d8e9dd;
  --warn:#9a5a06; --warn-soft:#f6e6c9; --bad:#a3322a; --bad-soft:#f5dcd9;
  --s-in:#1f7a45; --s-ext:#2f6fc0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141a16; --surface:#1d2520; --sunk:#252f28; --line:#36433a;
  --fg:#e4ebe5; --muted:#9caaa0; --accent:#6fbf8a; --accent-ink:#0f1a13; --accent-soft:#24402e;
  --warn:#e3a54a; --warn-soft:#3a2d17; --bad:#ec8a80; --bad-soft:#3d2220;
  --s-in:#3fa866; --s-ext:#5b8fe0; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:grid;gap:10px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title-row .left{display:flex;align-items:center;gap:8px;min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.back{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;min-width:40px;min-height:40px;font:700 18px var(--f-body);cursor:pointer;flex:0 0 auto}
.daybadge{font-family:var(--f-mono);font-size:14px;color:var(--muted);white-space:nowrap}
.daybadge b{color:var(--fg);font-weight:500}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent)}
.endzone{font-size:13px;color:var(--muted)}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
nav.tabs button{font:600 15px var(--f-body);border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:7px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
section.panel{display:grid;gap:16px;padding-top:8px}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:4px 0 0}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.note{font-size:14px;color:var(--muted);margin:0}
.banner{padding:10px 12px;border-radius:8px;font-size:14px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lab,.lab{font-weight:600;font-size:15px}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{width:100%;font:16px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 10px;min-height:46px}
.num{font-family:var(--f-mono)!important;font-size:18px!important}
textarea{min-height:76px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;font:600 15px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.seg button.alert[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{min-height:50px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 17px var(--f-body);cursor:pointer;padding:0 16px}
.primary:disabled{opacity:.5}
.ghost{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:10px 12px;font:600 15px var(--f-body);cursor:pointer;min-height:44px;text-align:center}
.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 auto}
.status{font-size:14px;min-height:20px;color:var(--muted)}
.status.ok{color:var(--accent)} .status.err{color:var(--bad)}
.alertbox{border-radius:10px;padding:12px 14px;background:var(--bad-soft);border:1px solid var(--bad);display:grid;gap:4px;font-size:15px}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;text-align:left;font:inherit;color:inherit;width:100%}
button.item{cursor:pointer}
.item.empty{background:transparent;border-style:dashed;color:var(--muted)}
.hhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.hhead .d{font-weight:700}
.mono{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--fg)}
.chip.al{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--accent-soft)}
.rem{font-size:14px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-line}
.who{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.dates button{flex:0 0 auto;min-width:54px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 4px;cursor:pointer;font:500 13px var(--f-mono);display:grid;gap:1px;justify-items:center}
.dates button small{font:600 11px var(--f-body);color:var(--muted);letter-spacing:.04em}
.dates button.done{border-color:var(--accent)}
.dates button.done small{color:var(--accent)}
.dates button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dates button[aria-pressed="true"] small{color:var(--accent-ink)}
.rel{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sunk);border-radius:8px;padding:8px 10px;font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.rel span{min-width:0}
.rel small{font-family:var(--f-body);color:var(--muted);font-size:12px;margin-left:6px}
.rel button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:4px 8px;cursor:pointer}
.rel.none{background:transparent;border:1px dashed var(--line);font-family:var(--f-body);color:var(--muted)}
.others{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.photos:empty{display:none}
.photos button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--sunk);cursor:pointer;max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.filebtn{display:inline-flex;align-items:center;justify-content:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(10,14,11,.94);display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.viewer img{width:100%;height:100%;object-fit:contain;min-height:0}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#e8eee9;font-size:14px}
.vbtn{color:#e8eee9;border-color:#5b6a60}
.vbtn.danger{color:#f3a49c;border-color:#f3a49c}
.ctitle{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
#chart{display:block;width:100%;height:auto;touch-action:pan-y}
#chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
#chart .lbl{fill:var(--fg);font-size:11.5px}
#chart .zone{fill:var(--accent-soft);opacity:.7}
#chart .zonet{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
#chart .grid{stroke:var(--line);stroke-width:1}
#chart .hit{fill:transparent;cursor:pointer}
.tip{font-size:14px;color:var(--muted);min-height:20px}
.tip b{color:var(--fg)}
.proto{display:grid;gap:10px}
.proto .pi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
dl.kv dt{color:var(--muted);font-size:13px;letter-spacing:.03em;text-transform:uppercase;padding-top:2px}
dl.kv dd{margin:0}
.al{color:var(--bad)}
ul.plain{margin:0;padding-left:20px;display:grid;gap:4px}
.sblock{display:grid;gap:6px}
.sblock h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sblock p{margin:0;font-size:15px}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.chauffecard{display:grid;gap:8px}
.chauffecard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.lotsTable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.lotsTable th,.lotsTable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.lotsTable th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.scrollx{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <div class="vbar"><span id="vcap"></span><button type="button" class="ghost vbtn" id="vclose">Fermer</button></div>
  <img id="vimg" alt="">
  <div class="vbar" id="vdelbar"><button type="button" class="ghost vbtn danger" id="vdel">Supprimer la photo</button></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

function dayDate(ch, n){ if(!ch.debut) return null; const d=new Date(ch.debut+'T12:00:00'); if(isNaN(d)) return null; d.setDate(d.getDate()+n-1); return d; }

/* ---------- Stockage IndexedDB ---------- */
const DB = (function(){
  let p=null;
  function open(){ if(p) return p; p=new Promise((ok,ko)=>{ const r=indexedDB.open('journal-chauffes',1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('chauffes',{keyPath:'id'}); d.createObjectStore('entrees',{keyPath:'id'}); d.createObjectStore('photos'); d.createObjectStore('reglages'); };
    r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); return p; }
  function run(store, mode, fn){ return open().then(d=>new Promise((ok,ko)=>{ const t=d.transaction(store,mode); const s=t.objectStore(store); let res; const r=fn(s); if(r) r.onsuccess=()=>{ res=r.result; }; t.oncomplete=()=>ok(res); t.onerror=()=>ko(t.error); t.onabort=()=>ko(t.error); })); }
  return {
    all:store=>run(store,'readonly',s=>s.getAll()),
    get:(store,key)=>run(store,'readonly',s=>s.get(key)),
    put:(store,val,key)=>run(store,'readwrite',s=>key===undefined?s.put(val):s.put(val,key)),
    del:(store,key)=>run(store,'readwrite',s=>s.delete(key)),
    putMany:(store,vals)=>open().then(d=>new Promise((ok,ko)=>{ const t=d.transaction(store,'readwrite'); const s=t.objectStore(store); vals.forEach(v=>s.put(v)); t.oncomplete=()=>ok(); t.onerror=()=>ko(t.error); }))
  };
})();

/* ---------- Données dérivées d'une chauffe ---------- */
function myObs(cid, jour){ return entriesOf(cid,'obs').find(e=>e.jour===jour && isMine(e)); }
function dayEntries(cid, jour){ return S.entrees.filter(e=>!e.supprime && e.chauffeId===cid && e.jour===jour); }
function dayFilled(cid, jour){ return dayEntries(cid,jour).some(e=>e.type==='releve'||e.type==='photo'||(e.type==='obs'&&(OBS_KEYS.some(k=>e[k])||e.remarque))); }
function alertsOf(r){ return OBS_KEYS.filter(k=>r[k] && OPTS[k].alert.includes(r[k])).map(k=>OPTS[k].label+' : '+r[k]); }
function lastDay(ch){ let n=0; for(let j=1;j<=ch.duree;j++) if(dayFilled(ch.id,j)) n=j; return n; }
function chauffeAlerts(ch){ return entriesOf(ch.id).filter(e=>(e.type==='obs'||e.type==='lot') && alertsOf(e).length).length; }
function releves(cid){ return entriesOf(cid,'releve').sort((a,b)=>a.jour-b.jour || (a.heure||'').localeCompare(b.heure||'')); }

/* ---------- Photos ---------- */
const photoUrls={};
function setPhoto(img,id){ if(photoUrls[id]){ img.src=photoUrls[id]; return; } DB.get('photos',id).then(b=>{ if(b){ photoUrls[id]=URL.createObjectURL(b); img.src=photoUrls[id]; } }).catch(()=>{}); }
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=url; });
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(b=>ok(b||file),'image/jpeg',0.82));
  } catch(e){ return file; } finally{ URL.revokeObjectURL(url); }
}
async function storePhotos(files){ const ids=[]; for(const f of files){ const b=await shrink(f); const id=uid(); await DB.put('photos',b,id); ids.push(id); } return ids; }

    const mine=S.entrees.filter(e=>e.auteurId===old).map(e=>Object.assign({},e,{auteurId:S.me.id}));

function segHTML(id,key,val){ return `<div class="seg" id="${id}">`+OPTS[key].opts.map(o=>`<button type="button" data-v="${esc(o)}" class="${OPTS[key].alert.includes(o)?'alert':''}" aria-pressed="${val===o}">${esc(o)}</button>`).join('')+'</div>'; }
function bindSeg(id,key,state,onChange){ const el=$(id); el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const v=b.dataset.v; state[key]=state[key]===v?'':v; el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===state[key])); onChange&&onChange(); }); }

function drawChart(ch){
  const VIEWS={in:['in'],ext:['ext'],both:['in','ext']};
  const SER=[{k:'in',name:'Dans les palox',color:'var(--s-in)',fill:true},{k:'ext',name:'Extérieur des palox',color:'var(--s-ext)',fill:false}];
  const vEl=$('g-view'); vEl.innerHTML='';
  [['in','Dans les palox'],['ext','Extérieur'],['both','Superposer']].forEach(([k,l])=>{ const b=document.createElement('button'); b.type='button'; b.textContent=l; b.setAttribute('aria-pressed',S.courbe===k);
    b.onclick=()=>{ S.courbe=k; try{ localStorage.setItem('chauffes:courbe',k); }catch(e){} $('g-tip').textContent='Touche un point de la courbe.'; drawChart(ch); }; vEl.appendChild(b); });
  const P={in:[],ext:[]};
  releves(ch.id).forEach(r=>{ let f=0.5; if(r.heure&&/^\d{1,2}:\d{2}$/.test(r.heure)){ const [h,m]=r.heure.split(':').map(Number); f=(h+m/60)/24; }
    const base={t:r.jour-1+f, r}; if(r.tInt!=null) P.in.push(Object.assign({v:r.tInt},base)); if(r.tExt!=null) P.ext.push(Object.assign({v:r.tExt},base)); });
  P.in.sort((a,b)=>a.t-b.t); P.ext.sort((a,b)=>a.t-b.t);
  const shown=SER.filter(s=>VIEWS[S.courbe].includes(s.k)); const D=ch.duree;
  const W=640,H=270,ml=34,mr=56,mt=22,mb=30,pw=W-ml-mr,ph=H-mt-mb;
  const all=[].concat(...shown.map(s=>P[s.k])).map(p=>p.v);
  let lo=all.length?Math.floor((Math.min(...all)-2)/5)*5:10, hi=all.length?Math.ceil((Math.max(...all)+2)/5)*5:35; if(hi-lo<10) hi=lo+10;
  const X=t=>ml+t/D*pw, Y=v=>mt+(hi-v)/(hi-lo)*ph;
  let g=`<rect class="zone" x="${X(ch.finDe-1)}" y="${mt}" width="${X(ch.finA)-X(ch.finDe-1)}" height="${ph}"></rect><text class="zonet" x="${(X(ch.finDe-1)+X(ch.finA))/2}" y="${mt-6}" text-anchor="middle">fin prévue</text>`;
  for(let v=lo;v<=hi;v+=5) g+=`<line class="grid" x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}"></line><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end">${v}°</text>`;
  const step=Math.max(1,Math.ceil(D/7)); for(let j=1;j<=D;j+=step) g+=`<text x="${X(j-0.5)}" y="${H-8}" text-anchor="middle">J${j}</text>`;
  const pts=[];
  shown.forEach(s=>{ const a=P[s.k]; if(!a.length) return;
    if(a.length>1) g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${a.map(p=>X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}"></polyline>`;
    a.forEach(p=>{ g+=`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5" fill="${s.fill?s.color:'var(--surface)'}" stroke="${s.fill?'var(--surface)':s.color}" stroke-width="2"></circle>`; pts.push({p,s}); });
    const last=a[a.length-1]; g+=`<text class="lbl" x="${X(last.t)+9}" y="${Y(last.v)+4+(S.courbe==='both'?(s.k==='ext'?6:-4):0)}">${last.v} °C</text>`; });
  pts.forEach((o,i)=>{ g+=`<circle class="hit" data-i="${i}" cx="${X(o.p.t).toFixed(1)}" cy="${Y(o.p.v).toFixed(1)}" r="13"></circle>`; });
  const svg=$('chart'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=g;
  svg.querySelectorAll('.hit').forEach(c=>c.onclick=()=>{ const o=pts[Number(c.dataset.i)], r=o.p.r;
    $('g-tip').innerHTML='<b>'+esc(o.p.v)+' °C</b> · '+esc(o.s.name.toLowerCase())+' · J'+r.jour+(ch.debut?' ('+esc(dayShort(ch,r.jour))+')':'')+(r.heure?' à '+esc(fmtH(r.heure)):'')+' · '+esc(authorName(r)); });
  $('g-leg').innerHTML=shown.filter(s=>P[s.k].length).map(s=>`<span><svg width="22" height="10" aria-hidden="true"><line x1="1" x2="21" y1="5" y2="5" stroke="${s.color}" stroke-width="2"></line><circle cx="11" cy="5" r="3.5" fill="${s.fill?s.color:'var(--surface)'}" stroke="${s.color}" stroke-width="1.5"></circle></svg>${esc(s.name)}</span>`).join('');
  const hk=S.courbe==='ext'?'ext':'in', li=P[hk][P[hk].length-1];
  $('g-title').textContent=li?(hk==='in'?'Dans les palox : ':'Extérieur des palox : ')+li.v+' °C au dernier relevé (J'+li.r.jour+')':'Températures';
  if(!all.length) $('g-tip').textContent=S.courbe==='both'?'Aucun relevé pour l\'instant : ajoute-en un dans l\'onglet Saisie.':'Aucun relevé pour cette courbe pour l\'instant.';
}

  $('p-phin').onchange=async e=>{ const files=[...e.target.files]; e.target.value=''; if(!files.length) return; try{ photoIds.push(...await storePhotos(files)); drawPh(); $('p-st').textContent='Photo prête : touche « Ajouter ce contrôle » pour l\'enregistrer.'; $('p-st').className='status ok'; }catch(err){ $('p-st').textContent='Plus de place sur l\'appareil.'; $('p-st').className='status err'; } };
  $('p-form').onsubmit=async e=>{ e.preventDefault(); const lot=$('p-lot').value.trim(); if(!lot){ $('p-st').textContent='Indique le numéro du lot.'; $('p-st').className='status err'; return; }
    const ent={id:uid(), type:'lot', chauffeId:ch.id, jour:Number($('p-jour').value), lot, variete:$('p-var').value.trim(), pg:$('p-pg').value.trim(), nb:num($('p-nb').value), remarque:$('p-rem').value.trim(), photos:photoIds.slice(), auteurId:S.me.id, auteurNom:S.me.nom, creeLe:nowIso()};
    LOT_KEYS.forEach(k=>ent[k]=st[k]||'');
    try{ await saveEntry(ent); toast('Contrôle du lot '+lot+' ajouté.'); S.jour=ent.jour; renderChauffe(); }catch(err){ $('p-st').textContent='Enregistrement impossible.'; $('p-st').className='status err'; } };
  const list=entriesOf(ch.id,'lot').sort((a,b)=>(b.creeLe||'').localeCompare(a.creeLe||''));
  const el=$('p-list');
  if(!list.length){ el.innerHTML='<div class="item empty">Aucun contrôle par lot pour l\'instant.</div>'; return; }
  list.forEach(r=>{ const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div class="hhead"><span class="d">Lot ${esc(r.lot)}${r.variete||r.pg?' · '+esc([r.variete,r.pg].filter(Boolean).join(' / ')):''}</span><span class="mono">J${r.jour}${ch.debut?' · '+esc(dayShort(ch,r.jour)):''}</span></div>
      <div class="who">${esc(authorName(r))}</div>${r.nb?`<div class="rem">${esc(r.nb)} plants regardés</div>`:''}
      <div class="chips">${LOT_KEYS.filter(k=>r[k]).map(k=>`<span class="chip${OPTS[k].alert.includes(r[k])?' al':''}">${esc(OPTS[k].label+' : '+r[k])}</span>`).join('')}</div>${r.remarque?`<div class="rem">${esc(r.remarque)}</div>`:''}`;
    if((r.photos||[]).length){ const g=document.createElement('div'); g.className='photos'; r.photos.forEach(id=>{ const b=document.createElement('button'); b.type='button'; const im=document.createElement('img'); im.alt=''; setPhoto(im,id); b.appendChild(im); b.onclick=()=>openViewer(id,'Lot '+r.lot+' · J'+r.jour,null); g.appendChild(b); }); d.appendChild(g); }
    if(isMine(r)){ const a=document.createElement('div'); a.className='confirm'; const del=document.createElement('button'); del.type='button'; del.className='ghost'; del.textContent='Supprimer'; let c=false;
      del.onclick=async()=>{ if(!c){ c=true; del.textContent='Toucher encore pour supprimer'; del.classList.add('danger'); return; } await removeEntry(r); for(const id of r.photos||[]){ try{ await DB.del('photos',id); }catch(e){} } toast('Contrôle supprimé.'); renderChauffe(); };
      a.appendChild(del); d.appendChild(a); }
    el.appendChild(d); });
}

/* ----- Onglet Infos (chauffe, lots, protocole, soudure) ----- */
function tabInfos(ch, body){
  const lots=ch.lots||[]; const tq=lots.reduce((s,l)=>s+(l.qte||0),0), tp=lots.reduce((s,l)=>s+(l.palox||0),0);
  const byPg={}; lots.forEach(l=>{ const k=l.pg||'?'; byPg[k]=(byPg[k]||0)+(l.qte||0); });
  body.innerHTML=`
    <div class="card">
      <div class="hhead"><h3>La chauffe</h3><button class="ghost" id="i-edit" type="button">Modifier</button></div>
      <dl class="kv"><dt>Durée</dt><dd>${ch.duree} jours · fin prévue J${ch.finDe}–J${ch.finA}</dd>${ch.debut?`<dt>Début</dt><dd>${esc(dayLabel(ch,1))}</dd>`:''}<dt>Lots</dt><dd>${lots.length}${tq?' · '+tq.toLocaleString('fr-FR')+' plants':''}${tp?' · '+tp+' palox':''}</dd>${Object.keys(byPg).length&&tq?`<dt>Porte-greffes</dt><dd>${Object.entries(byPg).map(([k,v])=>esc(k)+' '+(v?(Math.round(v/tq*1000)/10).toLocaleString('fr-FR')+' %':'')).join(' · ')}</dd>`:''}</dl>
      ${ch.notes?`<div class="rem">${esc(ch.notes)}</div>`:''}
      ${lots.length?`<div class="scrollx"><table class="lotsTable"><thead><tr><th>Lot</th><th>Variété</th><th>Porte-greffe</th><th>Plants</th><th>Palox</th></tr></thead><tbody>${lots.map(l=>`<tr><td>${esc(l.lot)}</td><td>${esc(l.variete||'')}</td><td>${esc(l.pg||'')}</td><td>${l.qte!=null?l.qte.toLocaleString('fr-FR'):''}</td><td>${l.palox!=null?l.palox:'—'}</td></tr>`).join('')}</tbody></table></div>`:''}
    </div>
    <div class="hhead"><h2>Protocole de contrôle</h2><button class="ghost" id="i-pedit" type="button">${S.editingProto?'Terminer':'Modifier'}</button></div>
    <p class="note" id="i-pintro">${esc(S.protoIntro)}</p>
    <div class="proto" id="i-proto"></div>
    <div class="card">
      <h3>Quand prévenir ${esc(S.prevenir)}</h3>
      <ul class="plain"><li>Odeur anormale à la base des plants.</li><li>Pas de gouttes sur la cire, ou couverture sèche.</li><li>Ruissellement ou eau qui stagne au fond d'un palox.</li><li>Bois sec ou détrempé.</li><li>Cal d'un seul côté, brun ou mou.</li><li>Un lot nettement en retard sur les autres pour les racines.</li><li>Une température qui change brusquement d'un jour à l'autre.</li></ul>
      <p class="note">Ces signes sont des signaux d'alerte, pas un diagnostic.</p>
    </div>
    <div class="card">
      <h3>La soudure du greffon et du porte-greffe</h3>
      <p class="note">Explications générales sur la technique, pas un protocole : en cas de doute, c'est le responsable de la pépinière qui décide.</p>
      <div class="sblock"><h4>Ce que c'est</h4><p>La soudure, c'est l'union du greffon et du porte-greffe en une seule plante. Au greffage, les deux morceaux sont seulement emboîtés. Pendant la chauffe, ils doivent se relier par un tissu vivant : le <b>cal</b>.</p></div>
      <div class="sblock"><h4>Comment elle se forme</h4><ol class="steps"><li><b>Contact.</b> Les deux cambiums (la fine couche verte vivante sous l'écorce) sont en contact grâce à la coupe de greffage.</li><li><b>Cal.</b> Avec la chaleur et l'humidité, chaque partie produit un tissu blanc-crème, tendre, au niveau des coupes.</li><li><b>Jonction.</b> Les cals du greffon et du porte-greffe grossissent et se rejoignent.</li><li><b>Vaisseaux.</b> De nouveaux vaisseaux se forment à travers le cal. La sève peut alors passer d'une partie à l'autre.</li></ol><p class="note">À la sortie de chauffe, la soudure n'est pas terminée : elle continue de se renforcer pendant la saison en pépinière.</p></div>
      <div class="sblock"><h4>Ce qui la favorise ou la gêne</h4><ul class="plain"><li><b>Chaleur :</b> accélère la formation du cal. Trop chaud, le cal devient abondant et fragile.</li><li><b>Humidité :</b> indispensable, un cal qui sèche meurt. Trop d'eau prive la base d'air et favorise les moisissures.</li><li><b>Qualité de la coupe :</b> un emboîtement serré et bien aligné laisse moins de vide à combler.</li><li><b>Réserves du bois :</b> le plant vit sur ses réserves tant qu'il n'a ni racines ni feuilles.</li></ul></div>
      <div class="sblock"><h4>Comment l'observer</h4><dl class="kv"><dt>Bon signe</dt><dd>Un bourrelet blanc-crème visible tout autour de la ligne de greffe, ferme au toucher.</dd><dt>À surveiller</dt><dd>Pas encore de cal visible : normal en début de chauffe, à comparer avec les autres lots.</dd><dt class="al">Alerte</dt><dd class="al">Cal d'un seul côté, cal brun ou noir, cal mou ou aqueux, ou moisissure à la greffe.</dd></dl><p class="note">Certaines pépinières testent la soudure en exerçant une légère pression sur le greffon. Ce geste peut casser une soudure fragile : ne le fais que si le responsable te le montre.</p></div>
    </div>`;
  $('i-edit').onclick=()=>{ renderChauffeForm._init=false; go('edit'); };
  $('i-pedit').onclick=()=>{ S.editingProto=!S.editingProto; renderChauffe(); };
  const pEl=$('i-proto');
  if(!S.editingProto){
    pEl.innerHTML=S.proto.map(p=>`<div class="pi"><h3>${esc(p.t)}</h3><dl class="kv"><dt>Comment</dt><dd>${esc(p.c)}</dd><dt>Normal</dt><dd>${esc(p.n)}</dd><dt>Alerte</dt><dd class="al">${esc(p.a)}</dd></dl></div>`).join('');
  } else {
    const draft=JSON.parse(JSON.stringify(S.proto));
    const draw=()=>{ pEl.innerHTML=`<div class="field"><label for="pi-intro">Introduction</label><textarea id="pi-intro">${esc(S.protoIntro)}</textarea></div>`+draft.map((p,i)=>`<div class="pi">
      <div class="field"><label for="pt${i}">Contrôle</label><input id="pt${i}" type="text" value="${esc(p.t)}"></div>
      <div class="field"><label for="pc${i}">Comment</label><textarea id="pc${i}">${esc(p.c)}</textarea></div>
      <div class="field"><label for="pn${i}">Normal</label><textarea id="pn${i}">${esc(p.n)}</textarea></div>
      <div class="field"><label for="pa${i}">Alerte</label><textarea id="pa${i}">${esc(p.a)}</textarea></div>
      <button class="ghost danger" type="button" data-del="${i}">Retirer ce contrôle</button></div>`).join('')+
      `<div class="row"><button class="ghost" type="button" id="pi-add">+ Ajouter un contrôle</button><button class="ghost" type="button" id="pi-reset">Revenir au protocole d'origine</button></div><button class="primary" type="button" id="pi-save">Enregistrer le protocole</button>`;
      const collect=()=>draft.forEach((p,i)=>{ p.t=$('pt'+i).value.trim(); p.c=$('pc'+i).value.trim(); p.n=$('pn'+i).value.trim(); p.a=$('pa'+i).value.trim(); });
      pEl.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ collect(); draft.splice(Number(b.dataset.del),1); draw(); });
      $('pi-add').onclick=()=>{ collect(); draft.push({t:'Nouveau contrôle',c:'',n:'',a:''}); draw(); };
      $('pi-reset').onclick=()=>{ draft.splice(0,draft.length,...JSON.parse(JSON.stringify(DEFAULT_PROTO))); $('pi-intro').value=DEFAULT_PROTO_INTRO; draw(); };
      $('pi-save').onclick=async()=>{ collect(); S.proto=draft.filter(p=>p.t); S.protoIntro=$('pi-intro').value.trim(); await DB.put('reglages',S.proto,'proto'); await DB.put('reglages',S.protoIntro,'protoIntro'); S.editingProto=false; toast('Protocole enregistré.'); renderChauffe(); };
    };
    draw(); $('i-pintro').hidden=true;
  }
}

/* ====================================================================
   RÉSUMÉ, CSV, PARTAGE, IMPORT (fusion)
   ==================================================================== */
function slug(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'chauffe'; }
function summary(ch){
  const out=[ch.nom+' — '+ch.duree+' jours, fin prévue J'+ch.finDe+'–J'+ch.finA+(ch.debut?' (début '+dayLabel(ch,1)+')':''),''];
  for(let j=1;j<=ch.duree;j++){ if(!dayFilled(ch.id,j)) continue; const ents=dayEntries(ch.id,j);
    out.push('J'+j+(ch.debut?' · '+dayLabel(ch,j):''));
    ents.filter(e=>e.type==='releve').sort((a,b)=>(a.heure||'').localeCompare(b.heure||'')).forEach(r=>out.push('  T° '+(r.heure?fmtH(r.heure):'heure ?')+' · ext. '+(r.tExt!=null?r.tExt+' °C':'—')+' · dedans '+(r.tInt!=null?r.tInt+' °C':'—')+' ('+authorName(r)+')'));
    ents.filter(e=>e.type==='obs').forEach(o=>{ const obs=OBS_KEYS.filter(k=>o[k]).map(k=>OPTS[k].label+' : '+o[k]); if(obs.length) out.push('  '+obs.join(' · ')+' ('+authorName(o)+')'); const al=alertsOf(o); if(al.length) out.push('  ⚠ À signaler : '+al.join(', ')); if(o.remarque) out.push('  '+o.remarque); });
    const ph=ents.filter(e=>e.type==='photo').length; if(ph) out.push('  '+ph+' photo'+(ph>1?'s':'')+' dans le journal');
  }
  const lots=entriesOf(ch.id,'lot').sort((a,b)=>a.jour-b.jour);
  if(lots.length){ out.push('','Contrôles par lot'); lots.forEach(r=>out.push('  J'+r.jour+' · Lot '+r.lot+((r.variete||r.pg)?' ('+[r.variete,r.pg].filter(Boolean).join('/')+')':'')+(r.nb?' · '+r.nb+' plants':'')+LOT_KEYS.filter(k=>r[k]).map(k=>' · '+OPTS[k].label+' : '+r[k]).join('')+(r.remarque?' · '+r.remarque:'')+' ('+authorName(r)+')')); }
  return out.join('\n');
}
function csv(ch){
  const c=v=>{ const s=v==null?'':String(v); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const rows=[['Jour','Date','Type','Heure','T° ext. (°C)','T° dans palox (°C)','Lot','Variété','Porte-greffe','Nb plants',...OBS_KEYS.map(k=>OPTS[k].label),'Remarques','Auteur']];
  const ents=entriesOf(ch.id).filter(e=>e.type!=='photo').sort((a,b)=>a.jour-b.jour||(a.heure||'').localeCompare(b.heure||''));
  ents.forEach(e=>rows.push(['J'+e.jour, dayShort(ch,e.jour), {releve:'Relevé',obs:'Observation',lot:'Contrôle lot'}[e.type]||e.type, e.heure||'', e.tExt??'', e.tInt??'', e.lot||'', e.variete||'', e.pg||'', e.nb??'', ...OBS_KEYS.map(k=>e[k]||''), e.remarque||'', authorName(e)]));
  return rows.map(r=>r.map(c).join(';')).join('\r\n');
}
async function shareFile(file, st, okMsg){
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:file.name}); st.textContent=okMsg; st.className='status ok'; return; } }
  catch(e){ if(e && e.name==='AbortError'){ st.textContent='Partage annulé.'; st.className='status'; return; } }
  const u=URL.createObjectURL(file); const a=document.createElement('a'); a.href=u; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000);
  st.textContent=okMsg+' (téléchargé)'; st.className='status ok';
}
const blobToData=b=>new Promise(ok=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.readAsDataURL(b); });
async function exportAll(st){
  st.textContent='Préparation du fichier…'; st.className='status';
  try{
    const photos={}; const ids=new Set();
    S.entrees.filter(e=>!e.supprime).forEach(e=>{ if(e.photoId) ids.add(e.photoId); (e.photos||[]).forEach(id=>ids.add(id)); });
    for(const id of ids){ const b=await DB.get('photos',id); if(b) photos[id]=await blobToData(b); }
    const data={format:'journal-chauffes', version:1, exportePar:S.me.nom, exporteLe:nowIso(), chauffes:S.chauffes, entrees:S.entrees, photos};
    const d=new Date(); const name='notes-chauffes-'+slug(S.me.nom)+'-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
    await shareFile(new File([JSON.stringify(data)], name, {type:'application/json'}), st, 'Fichier prêt.');
  }catch(e){ st.textContent='Export impossible.'; st.className='status err'; }
}
async function importFile(e, st){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  st.textContent='Lecture du fichier…'; st.className='status';
  try{
    const j=JSON.parse(await f.text());
    if(!j || j.format!=='journal-chauffes'){ st.textContent='Ce fichier ne vient pas du Journal de chauffes.'; st.className='status err'; return; }
    let nc=0, ne=0, np=0;
    const newer=(a,b)=>!a || (b.majLe||'')>(a.majLe||'');
    for(const c of j.chauffes||[]){ const ex=S.chauffes.find(x=>x.id===c.id); if(newer(ex,c)){ await DB.put('chauffes',c); if(ex) Object.assign(ex,c); else S.chauffes.push(c); nc++; } }
    const batch=[];
    for(const en of j.entrees||[]){ const ex=S.entrees.find(x=>x.id===en.id); if(newer(ex,en)){ batch.push(en); if(ex) Object.assign(ex,en); else S.entrees.push(en); ne++; } }
    if(batch.length) await DB.putMany('entrees',batch);
    for(const [id,u] of Object.entries(j.photos||{})){ const ex=await DB.get('photos',id); if(!ex){ const b=await (await fetch(u)).blob(); await DB.put('photos',b,id); np++; } }
    st.textContent=(nc||ne||np)?`Importé : ${ne} note${ne>1?'s':''}, ${nc} chauffe${nc>1?'s':''}, ${np} photo${np>1?'s':''}${j.exportePar?' (de '+j.exportePar+')':''}.`:'Rien de nouveau dans ce fichier : tout y était déjà.';
    st.className='status ok'; toast('Import terminé.');
    setTimeout(render,1200);
  }catch(err){ st.textContent='Fichier illisible ou stockage plein.'; st.className='status err'; }
}

})();

    reg.addEventListener('updatefound',()=>{ const w=reg.installing; if(!w) return; w.addEventListener('statechange',()=>{ if(w.state==='installed' && navigator.serviceWorker.controller){ const b=document.createElement('div'); b.className='banner'; b.style.margin='10px 16px'; b.innerHTML='<span>Une nouvelle version de l\'app est prête.</span>'; const btn=document.createElement('button'); btn.className='ghost'; btn.textContent='Recharger'; btn.onclick=()=>location.reload(); b.appendChild(btn); document.body.prepend(b); } }); });
  }).catch(()=>{});
}
